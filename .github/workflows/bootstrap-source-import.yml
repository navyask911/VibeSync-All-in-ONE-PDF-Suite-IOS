name: Bootstrap source repository import

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch compliance branch and push it to the new main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir source-copy
          cd source-copy
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin https://github.com/navyask911/VibeSync-All-in-ONE-PDF-Suite.git
          git fetch --no-tags origin refs/heads/playstore/v1.0.7-compliance
          git checkout -b source-import FETCH_HEAD
          git remote set-url origin https://github.com/navyask911/VibeSync-All-in-ONE-PDF-Suite-IOS.git
          git fetch --no-tags origin main
          git merge --strategy=ort -X ours --allow-unrelated-histories --no-edit FETCH_HEAD
          echo "=== git remote -v ==="
          git remote -v
          echo "=== git log -1 --oneline ==="
          git log -1 --oneline
          echo "=== git diff --stat ==="
          git diff --stat HEAD^ HEAD || true
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH_HEADER" push origin HEAD:refs/heads/main
