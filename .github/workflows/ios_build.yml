name: iOS Device Archive and Simulator Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "screenshots/**"
  pull_request:
    paths:
      - "shared/**"
      - "iosApp/**"
      - "android/build.gradle.kts"
      - "android/settings.gradle.kts"
      - "android/gradle/**"
      - "android/gradlew"
      - ".github/workflows/ios_build.yml"
      - "README_APPSTORE.md"

permissions:
  contents: write

concurrency:
  group: ios-device-archive-and-tests-${{ github.ref }}
  # Keep an active Xcode build alive; do not cancel it when another run is queued.
  cancel-in-progress: false

jobs:
  build-ios-test-and-device-archive:
    name: Run Simulator XCTests and create unsigned iOS device IPA
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.4 toolchain
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          java -version

      - name: Install CocoaPods and Google ML Kit
        run: |
          set -euo pipefail
          sudo gem install cocoapods --no-document
          pod --version
          pod install --repo-update --project-directory=iosApp

      - name: Install Rosetta for x86_64 ML Kit simulator binaries
        run: |
          set -euo pipefail
          if ! /usr/bin/arch -x86_64 /usr/bin/true >/dev/null 2>&1; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          /usr/bin/arch -x86_64 /usr/bin/true


      - name: Inspect installed iOS Simulator runtimes
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devicetypes

      - name: Run iOS navigation UI tests and PDF engine XCTest
        run: |
          set -euo pipefail
          chmod +x android/gradlew

          SIMULATOR_DEVICES=$(xcrun simctl list devices available -j)
          DEVICE_UDID=$(printf '%s' "$SIMULATOR_DEVICES" | python3 -c '
          import json, sys
          devices = json.load(sys.stdin).get("devices", {})
          runtime = "com.apple.CoreSimulator.SimRuntime.iOS-18-5"
          candidates = [
              device["udid"] for device in devices.get(runtime, [])
              if device.get("isAvailable") and device.get("name", "").startswith("iPhone")
          ]
          print(candidates[0] if candidates else "")
          ')
          if [ -z "$DEVICE_UDID" ]; then
            echo "No pre-created iOS 18.5 iPhone simulator found; creating one."
            SIM_RUNTIME=$(xcrun simctl list runtimes -j | python3 -c '
            import json, sys
            runtimes = json.load(sys.stdin).get("runtimes", [])
            candidates = [r["identifier"] for r in runtimes if r.get("isAvailable") and r.get("platform") == "iOS" and r.get("version") == "18.5"]
            print(candidates[0] if candidates else "")
            ')
            DEVICE_TYPE=$(xcrun simctl list devicetypes -j | python3 -c '
            import json, sys
            types = json.load(sys.stdin).get("devicetypes", [])
            candidates = [d["identifier"] for d in types if d.get("identifier") == "com.apple.CoreSimulator.SimDeviceType.iPhone-16"]
            print(candidates[0] if candidates else "")
            ')
            if [ -z "$SIM_RUNTIME" ] || [ -z "$DEVICE_TYPE" ]; then
              echo "::error::The preinstalled iOS 18.5 simulator runtime or iPhone 16 device type is missing."
              xcrun simctl list runtimes
              xcrun simctl list devicetypes
              exit 1
            fi
            DEVICE_UDID=$(xcrun simctl create "VibeSync CI iPhone" "$DEVICE_TYPE" "$SIM_RUNTIME")
          fi
          echo "Selected iOS Simulator: $DEVICE_UDID"
          xcrun simctl boot "$DEVICE_UDID" || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b
          xcodebuild -showdestinations -workspace iosApp/VibeSyncIOS.xcworkspace -scheme VibeSyncIOSApp
          xcodebuild -showdestinations -workspace iosApp/VibeSyncIOS.xcworkspace -scheme VibeSyncIOSApp

          RESULT_BUNDLE="$RUNNER_TEMP/VibeSyncIOSUITests.xcresult"
          xcodebuild test \
            -workspace iosApp/VibeSyncIOS.xcworkspace \
            -scheme VibeSyncIOSApp \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_UDID" \
            -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/VibeSyncDerivedData" \
            -resultBundlePath "$RESULT_BUNDLE" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            ARCHS=x86_64 \
            KOTLIN_SIMULATOR_TARGET=iosX64

          SIMULATED_ENTITLEMENTS="$RUNNER_TEMP/VibeSyncDerivedData/Build/Intermediates.noindex/VibeSyncIOS.build/Debug-iphonesimulator/VibeSyncIOSApp.build/VibeSyncIOSApp.app-Simulated.xcent"
          test -s "$SIMULATED_ENTITLEMENTS"
          python3 - "$SIMULATED_ENTITLEMENTS" <<'PY'
          import plistlib
          import sys

          with open(sys.argv[1], "rb") as entitlement_file:
              entitlements = plistlib.load(entitlement_file)

          bundle_identifier = "com.vibesync.toolkit.pdf.ios"
          access_groups = entitlements.get("keychain-access-groups", [])
          if not any(group.endswith(bundle_identifier) for group in access_groups):
              raise SystemExit(
                  "The simulator app is missing its Keychain access group: "
                  + repr(access_groups)
              )

          print("Verified simulator Keychain access group:", access_groups)
          PY

      - name: Package iOS Simulator app bundle
        if: success()
        run: |
          cd "$RUNNER_TEMP/VibeSyncDerivedData/Build/Products/Debug-iphonesimulator"
          ditto -c -k --sequesterRsrc --keepParent VibeSyncIOSApp.app "$RUNNER_TEMP/VibeSyncIOSApp.zip"

      - name: Archive unsigned iOS device app and package IPA
        if: success()
        run: |
          set -euo pipefail

          DEVICE_ARCHIVE="$RUNNER_TEMP/VibeSyncIOSApp-unsigned.xcarchive"
          DEVICE_DERIVED_DATA="$RUNNER_TEMP/VibeSyncDeviceDerivedData"
          APP_PATH="$DEVICE_ARCHIVE/Products/Applications/VibeSyncIOSApp.app"
          IPA_ROOT="$RUNNER_TEMP/VibeSyncIOSIPA"
          IPA_PATH="$RUNNER_TEMP/VibeSyncIOSApp-unsigned.ipa"

          # Build the physical-device arm64 framework, not an iOS Simulator slice.
          xcodebuild archive \
            -workspace iosApp/VibeSyncIOS.xcworkspace \
            -scheme VibeSyncIOSApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$DEVICE_ARCHIVE" \
            -derivedDataPath "$DEVICE_DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            KOTLIN_SIMULATOR_TARGET=iosArm64

          test -d "$APP_PATH"
          APP_EXECUTABLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist")
          test -s "$APP_PATH/$APP_EXECUTABLE"

          # Keep the app bundle unsigned; Sideloadly can re-sign it with the user's Apple ID.
          if [ -d "$APP_PATH/_CodeSignature" ]; then
            echo "::error::Expected an unsigned app bundle, but _CodeSignature is present."
            exit 1
          fi

          rm -rf "$IPA_ROOT"
          mkdir -p "$IPA_ROOT/Payload"
          ditto "$APP_PATH" "$IPA_ROOT/Payload/VibeSyncIOSApp.app"
          (cd "$IPA_ROOT" && zip -qry "$IPA_PATH" Payload)
          test -s "$IPA_PATH"

          python3 - "$IPA_PATH" <<'PY'
          import plistlib
          import sys
          import zipfile

          ipa_path = sys.argv[1]
          app_root = "Payload/VibeSyncIOSApp.app"
          with zipfile.ZipFile(ipa_path) as ipa:
              names = set(ipa.namelist())
              info_path = f"{app_root}/Info.plist"
              if info_path not in names:
                  raise SystemExit("Unsigned IPA is missing Payload/VibeSyncIOSApp.app/Info.plist")
              info = plistlib.loads(ipa.read(info_path))
              executable = info.get("CFBundleExecutable")
              if not executable or f"{app_root}/{executable}" not in names:
                  raise SystemExit("Unsigned IPA is missing its app executable")
              if f"{app_root}/_CodeSignature/CodeResources" in names:
                  raise SystemExit("Expected an unsigned IPA, but the app signature resource exists")
              print("Verified unsigned device IPA:", ipa_path)
              print("Bundle identifier:", info.get("CFBundleIdentifier", "unknown"))
              print("Executable:", executable)
          PY

      - name: Export screenshots captured by automated navigation taps
        run: |
          set -euo pipefail
          RESULT_BUNDLE="$RUNNER_TEMP/VibeSyncIOSUITests.xcresult"
          ATTACHMENT_DIR="$RUNNER_TEMP/VibeSyncUITestAttachments"
          mkdir -p "$ATTACHMENT_DIR" screenshots

          xcrun xcresulttool export attachments \
            --path "$RESULT_BUNDLE" \
            --output-path "$ATTACHMENT_DIR"

          python3 - "$ATTACHMENT_DIR" "$GITHUB_WORKSPACE/screenshots" <<'PY'
          import json
          import os
          import shutil
          import sys

          attachment_dir, screenshot_dir = sys.argv[1:3]
          manifest_path = os.path.join(attachment_dir, "manifest.json")
          with open(manifest_path, encoding="utf-8") as manifest_file:
              entries = json.load(manifest_file)

          required = {
              "screenshot_dashboard": "screenshot_dashboard.png",
              "screenshot_viewer": "screenshot_viewer.png",
              "screenshot_translation": "screenshot_translation.png",
              "screenshot_id_card": "screenshot_id_card.png",
              "screenshot_signature": "screenshot_signature.png",
          }
          exported = {}
          for entry in entries:
              for attachment in entry.get("attachments", []):
                  readable_name = attachment.get("suggestedHumanReadableName", "")
                  exported_name = attachment.get("exportedFileName", "")
                  if not exported_name:
                      continue
                  for key, filename in required.items():
                      if key in readable_name.lower():
                          source = os.path.join(attachment_dir, exported_name)
                          if os.path.isfile(source):
                              target = os.path.join(screenshot_dir, filename)
                              shutil.copy2(source, target)
                              exported[key] = target

          missing = sorted(set(required) - set(exported))
          if missing:
              raise SystemExit(
                  "Missing expected UI screenshots: " + ", ".join(missing)
                  + ". Exported manifest: " + json.dumps(entries)
              )

          for key, path in exported.items():
              if os.path.getsize(path) <= 0:
                  raise SystemExit("Screenshot is empty: " + path)
              print(f"{key}: {path} ({os.path.getsize(path)} bytes)")
          PY

          file screenshots/screenshot_dashboard.png screenshots/screenshot_viewer.png screenshots/screenshot_translation.png screenshots/screenshot_id_card.png screenshots/screenshot_signature.png

      - name: Commit internal feature screenshots to repository
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && success()
        run: |
          set -euo pipefail
          git add iosApp/Podfile.lock screenshots/screenshot_dashboard.png screenshots/screenshot_viewer.png screenshots/screenshot_translation.png screenshots/screenshot_id_card.png screenshots/screenshot_signature.png

          if git diff --cached --quiet; then
            echo "Feature screenshots are unchanged; skipping commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci(ios): publish ID card and signature screenshots"

          # The iOS streaming workflow may publish a bot commit to main while
          # this simulator job is running. Rebase our generated assets onto the
          # newest main before pushing, and retry if another bot wins the race.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "Rebase conflicted while publishing screenshots (attempt $attempt/5)."
              if [ "$attempt" -eq 5 ]; then
                echo "::error::Unable to rebase screenshot publication onto origin/main."
                exit 1
              fi
              sleep $((attempt * 2))
              continue
            fi

            if git push origin "HEAD:main"; then
              echo "Published feature screenshots to the latest main."
              exit 0
            fi

            echo "main advanced during screenshot push (attempt $attempt/5); retrying."
            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 2))
            fi
          done

          echo "::error::Unable to publish screenshots after five retries."
          exit 1

      - name: Upload iOS Simulator screenshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VibeSyncIOS-Simulator-Screenshot
          path: |
            screenshots/screenshot_dashboard.png
            screenshots/screenshot_viewer.png
            screenshots/screenshot_translation.png
            screenshots/screenshot_id_card.png
            screenshots/screenshot_signature.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload iOS Simulator app artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VibeSyncIOSApp-iOS-Simulator
          path: ${{ runner.temp }}/VibeSyncIOSApp.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned iOS device IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VibeSyncIOSApp-iOS-Unsigned-IPA
          path: ${{ runner.temp }}/VibeSyncIOSApp-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
