name: iOS Simulator Build

on:
  workflow_dispatch:
  push:
    paths:
      - "shared/**"
      - "iosApp/**"
      - "android/build.gradle.kts"
      - "android/settings.gradle.kts"
      - "android/gradle/**"
      - "android/gradlew"
      - ".github/workflows/ios_build.yml"
  pull_request:
    paths:
      - "shared/**"
      - "iosApp/**"
      - "android/build.gradle.kts"
      - "android/settings.gradle.kts"
      - "android/gradle/**"
      - "android/gradlew"
      - ".github/workflows/ios_build.yml"

permissions:
  contents: read

concurrency:
  group: ios-simulator-${{ github.ref }}
  # Keep an active Xcode build alive; do not cancel it when another run is queued.
  cancel-in-progress: false

jobs:
  build-ios-simulator:
    name: Build iOS Simulator (arm64)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          java -version

      - name: Build SwiftUI app and KMP framework
        run: |
          chmod +x android/gradlew
          xcodebuild \
            -project iosApp/VibeSyncIOS.xcodeproj \
            -scheme VibeSyncIOSApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/VibeSyncDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload iOS Simulator app artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VibeSyncIOSApp-iOS-Simulator
          path: ${{ runner.temp }}/VibeSyncDerivedData/Build/Products/Debug-iphonesimulator/VibeSyncIOSApp.app
          if-no-files-found: error
          retention-days: 14
