name: iOS Simulator Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "shared/**"
      - "iosApp/**"
      - "android/build.gradle.kts"
      - "android/settings.gradle.kts"
      - "android/gradle/**"
      - "android/gradlew"
      - ".github/workflows/ios_build.yml"

permissions:
  contents: read

concurrency:
  group: ios-simulator-${{ github.ref }}
  # Keep an active Xcode build alive; do not cancel it when another run is queued.
  cancel-in-progress: false

jobs:
  build-ios-simulator:
    name: Build iOS Simulator (arm64)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          java -version

      - name: Build SwiftUI app and KMP framework
        run: |
          chmod +x android/gradlew
          xcodebuild \
            -project iosApp/VibeSyncIOS.xcodeproj \
            -scheme VibeSyncIOSApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/VibeSyncDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package iOS Simulator app bundle
        if: success()
        run: |
          cd "$RUNNER_TEMP/VibeSyncDerivedData/Build/Products/Debug-iphonesimulator"
          ditto -c -k --sequesterRsrc --keepParent VibeSyncIOSApp.app "$RUNNER_TEMP/VibeSyncIOSApp.zip"

      - name: Capture iOS Simulator screenshot
        env:
          APP_PATH: ${{ runner.temp }}/VibeSyncDerivedData/Build/Products/Debug-iphonesimulator/VibeSyncIOSApp.app
        run: |
          set -euo pipefail
          test -d "$APP_PATH"

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")
          DEVICE_UDID=$(xcrun simctl list devices available | sed -nE 's/^[[:space:]]*(iPhone[^()]*) \(([0-9A-Fa-f-]{36})\) .*/\2/p' | head -n 1)
          if [ -z "$DEVICE_UDID" ]; then
            echo "::error::No available iPhone Simulator was found."
            xcrun simctl list devices available
            exit 1
          fi

          echo "Booting iPhone Simulator: $DEVICE_UDID"
          xcrun simctl boot "$DEVICE_UDID"
          xcrun simctl bootstatus "$DEVICE_UDID" -b
          xcrun simctl install booted "$APP_PATH"
          xcrun simctl launch booted "$BUNDLE_ID"
          sleep 4
          xcrun simctl io booted screenshot screenshot_main.png
          test -s screenshot_main.png
          file screenshot_main.png

      - name: Upload iOS Simulator screenshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VibeSyncIOS-Simulator-Screenshot
          path: screenshot_main.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload iOS Simulator app artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VibeSyncIOSApp-iOS-Simulator
          path: ${{ runner.temp }}/VibeSyncIOSApp.zip
          if-no-files-found: error
          retention-days: 14
